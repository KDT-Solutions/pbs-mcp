services:
  pbs-mcp:
    # Fertiges Image aus der GitHub Container Registry (per GitHub Actions bei jedem
    # Push auf main gebaut), damit "Pull and redeploy" in Portainer zuverlaessig geht.
    image: ghcr.io/kdt-solutions/pbs-mcp:latest
    # Bei jedem Deploy/Redeploy das Image aus der Registry neu ziehen, statt
    # eine lokal schon vorhandene (evtl. veraltete) :latest-Kopie zu verwenden.
    pull_policy: always
    container_name: pbs-mcp-cloud
    restart: unless-stopped
    # Haertung: unprivilegierter User (Dockerfile), Root-Dateisystem nur lesbar,
    # keine Linux-Capabilities, keine Rechteausweitung. Der Server schreibt nichts auf Platte.
    # cap_drop/security_opt/no-new-privileges sind hier bewusst nicht gesetzt: Portainer lehnt
    # security-opt und Capabilities fuer Nicht-Admin-Benutzer ab (Stack wird vom MCP-User deployt).
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - PBS_URL=${PBS_URL}
      - PBS_TOKEN_ID=${PBS_TOKEN_ID}
      - PBS_TOKEN_SECRET=${PBS_TOKEN_SECRET}
      - PBS_VERIFY_SSL=${PBS_VERIFY_SSL:-true}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_READONLY=${MCP_READONLY:-false}
      - MCP_ALLOW_DELETE=${MCP_ALLOW_DELETE:-false}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Standardmaessig nur auf 127.0.0.1 des Docker-Hosts gemappt. Laeuft der
      # Reverse-Proxy (NPM) auf einem anderen Host, MCP_BIND_ADDR auf die LAN-IP
      # setzen, ueber die NPM den Dienst erreicht. Die Zugriffskontrolle ist das
      # Bearer-Token, TLS macht der Reverse-Proxy.
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8423}:8000"
