services:
  pbs-mcp:
    # Fertiges Image aus der GitHub Container Registry (per GitHub Actions bei jedem
    # Push auf main gebaut), damit "Pull and redeploy" in Portainer zuverlaessig geht.
    image: ghcr.io/kdt-solutions/pbs-mcp:latest
    # Bei jedem Deploy/Redeploy das Image aus der Registry neu ziehen, statt
    # eine lokal schon vorhandene (evtl. veraltete) :latest-Kopie zu verwenden.
    pull_policy: always
    container_name: pbs-mcp-cloud
    restart: unless-stopped
    environment:
      - PBS_URL=${PBS_URL}
      - PBS_TOKEN_ID=${PBS_TOKEN_ID}
      - PBS_TOKEN_SECRET=${PBS_TOKEN_SECRET}
      - PBS_VERIFY_SSL=${PBS_VERIFY_SSL:-true}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_READONLY=${MCP_READONLY:-false}
      - MCP_ALLOW_DELETE=${MCP_ALLOW_DELETE:-false}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      # Auf allen Interfaces gebunden (Standard wie bei allen MCP-Stacks), damit
      # NPM den Dienst ueber <Host-IP>:8423 erreicht. Die Zugriffskontrolle ist das
      # Bearer-Token, TLS macht der Reverse-Proxy. Ueber MCP_BIND_ADDR einschraenkbar.
      - "${MCP_BIND_ADDR:-0.0.0.0}:${MCP_HOST_PORT:-8423}:8000"
