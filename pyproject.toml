[project]
name = "pbs-mcp"
version = "0.2.0"
description = "MCP-Server (read-only) fuer Proxmox Backup Server: Datastores, Snapshots, Verify-Status, Tasks"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.30.0",
    "starlette>=0.27.0",
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
pbs-mcp = "pbs_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbs_mcp"]
